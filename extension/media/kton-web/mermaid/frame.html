<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- The sandboxed Mermaid frame (C1.5 v3, VERTICLE-HOSTS H12/H13): the only frame with style-src
     'unsafe-inline'. Loaded with sandbox="allow-scripts" and no allow-same-origin, so its origin is opaque.
     Classic scripts: an opaque origin cannot load modules without CORS. In VS Code it is served from
     127.0.0.1 (asExternalUri), only these files, pinned by hash, and named in the webview's frame-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:;">
<title>mermaid</title></head><body>
<script src="../vendor/mermaid/mermaid.min.js"></script>
<script src="frame.js"></script>
</body></html>
