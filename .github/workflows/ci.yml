name: ci

# Two kinds of job, and the split is the point.
#
# `test` runs against the kernel version go.mod requires. That is the claim this repository makes
# about itself, so it is the one that gates a merge.
#
# `kernel-main` runs the same suite against kton `main` HEAD and is allowed to fail. The kernel
# moves under this repository, and it has broken things here four separate times — each of which
# showed up as a symptom (an unknown subcommand, an empty registry read) rather than as "the kernel
# moved". A job that says so out loud, on a schedule, turns that into news instead of a debugging
# session.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Drift from a moving kernel is the thing this catches, and it happens whether or not anyone
    # pushed here.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: against the kernel go.mod requires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cockpit

      - uses: actions/setup-go@v5
        with:
          go-version-file: cockpit/go.mod

      - name: gofmt
        working-directory: cockpit
        run: |
          # `./...`, not `.`: Go's own package list is exactly this module's source.
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          [ -z "$unformatted" ] || { echo "not gofmt'd:"; echo "$unformatted"; exit 1; }

      - name: go vet
        working-directory: cockpit
        run: go vet ./...

      # The suite builds the kernel CLIs itself, from the module go.mod requires; they are not built
      # here, so that CI exercises the same path a contributor's machine does.
      #
      # One run, verbose, and its log checked for skips. "Nothing in the default suite skips" is a
      # property this repository states in AGENTS.md, and a suite that quietly degrades to skips is
      # precisely how it previously spent months reporting success while exercising none of the
      # handlers. It used to be asserted by running the whole suite a second time.
      - name: go test, and no skips in it
        working-directory: cockpit
        run: |
          if ! go test -count=1 -v ./... > /tmp/test.log 2>&1; then
            # A failing test's own lines come before its --- FAIL, between it and its === RUN.
            awk '/^=== RUN/{buf=""} {buf=buf $0 "\n"} /^ *--- FAIL/{printf "%s", buf; buf=""} /^(FAIL|panic:)/{print}' /tmp/test.log | head -300
            tail -30 /tmp/test.log; exit 1
          fi
          if grep -q "^--- SKIP" /tmp/test.log; then
            echo "the default suite skipped something:"; grep -A2 "^--- SKIP" /tmp/test.log; exit 1
          fi
          grep -E "^(ok|FAIL)" /tmp/test.log
          echo "no skips"

  examples:
    name: the examples
    # Its own job, beside the suite rather than after it: the two share nothing, and the examples
    # are the slow part (nix fetching R's closure on a cold runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cockpit
      - uses: actions/setup-go@v5
        with:
          go-version-file: cockpit/go.mod

      # The examples refuse to skip: an example that cannot run fails, because you asked for it.
      # That rule is right and it puts the burden here — a runner that lacks R or nix is a runner
      # this workflow has to equip, not a reason to soften the rule. 10 needs R, 11 and 12 need nix
      # and docker, and 10 also reaches data.wien.gv.at for the open data it pins.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # R for 10 comes from the nixpkgs 11 pins, so it is the closure 11 fetches anyway. It used to
      # come from setup-r, whose apt install took ten minutes on a slow mirror for one example.
      - name: R, from the nixpkgs example 11 pins
        run: |
          nix-build -E 'import (fetchTarball "https://github.com/NixOS/nixpkgs/archive/refs/tags/25.05.tar.gz") {}' \
            -A R -o "$RUNNER_TEMP/r"
          echo "$RUNNER_TEMP/r/bin" >> "$GITHUB_PATH"

      - name: examples
        working-directory: cockpit
        # 11 and 12 build R's Nix closure — about 2 GB the first time on a cold runner.
        timeout-minutes: 60
        run: examples/run-all.sh

  docker:
    name: the container path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cockpit
      - uses: actions/setup-go@v5
        with:
          go-version-file: cockpit/go.mod

      # Its own job so a registry hiccup pulling an image cannot be mistaken for the default suite
      # failing. These tests drive a real engine on purpose (ADR-003): asking for them without one
      # is a failure and not a skip, because you asked.
      - name: go test -tags docker
        working-directory: cockpit
        run: go test -tags docker ./...

  cli:
    name: the command line, end to end
    # uat/cli.sh: two participants set up, work, take each other in and reproduce with nothing but
    # `cockpit` — the walkthrough a person at a shell follows. It pins and pulls a public image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cockpit
      - uses: actions/setup-go@v5
        with:
          go-version-file: cockpit/go.mod
      - name: uat/cli.sh
        working-directory: cockpit
        timeout-minutes: 20
        run: |
          git config --global user.name ci
          git config --global user.email ci@cockpit.local
          uat/cli.sh

  kernel-main:
    name: against kton main (advisory)
    runs-on: ubuntu-latest
    # Allowed to fail. A red mark here means upstream moved, which is news rather than a defect in
    # this branch — and the job above, on the version go.mod requires, is what gates anything.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: cockpit
      - uses: actions/setup-go@v5
        with:
          go-version-file: cockpit/go.mod

      - name: move to kton main HEAD
        working-directory: cockpit
        run: |
          echo "required: $(go list -m -f '{{.Version}}' kton.dev/plankton)"
          go get kton.dev/plankton@main kton.dev/nekton@main kton.dev/kton@main
          # -e: tidy also reads the files behind -tags unreleased, whose imports (ktonpkg, the
          # unpublished kernel packages) do not resolve here. What builds without the tag still does.
          go mod tidy -e
          echo "main HEAD: $(go list -m -f '{{.Version}}' kton.dev/plankton)"

      - name: go test against main
        working-directory: cockpit
        run: go test ./...
